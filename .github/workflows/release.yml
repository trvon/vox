name: Release

on:
  push:
    branches: [main]
  # Rebuild a published tag's artifacts (for example after a runner image
  # change) without cutting a new release.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build release artifacts for (for example v0.3.0)
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: rust

  build:
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || inputs.tag != '')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: vox-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: vox-aarch64-linux
          - target: x86_64-apple-darwin
            os: macos-14
            name: vox-x86_64-macos
          - target: aarch64-apple-darwin
            os: macos-14
            name: vox-aarch64-macos

    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
      # Set by release-please on main, or passed to a manual rebuild.
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Cached Rust build metadata may outlive the downloaded native assets.
      - name: Refresh sherpa native library discovery
        run: |
          # A restored lib/ directory may be empty: sherpa's build script only
          # checks that it exists. Discard partial native caches before discovery.
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          cache = Path("target/sherpa-onnx-prebuilt")
          if cache.exists():
              print(f"Restored native archives: {len(list(cache.rglob('*.a')))}")
              shutil.rmtree(cache)
          PY
          cargo clean --package sherpa-onnx-sys

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          # Host packages must stay amd64-only and arm64 must come from ports.
          # Ubuntu 24.04+ runners use deb822 sources, where the old one-line
          # sed on /etc/apt/sources.list matched nothing and apt then asked
          # security.ubuntu.com for arm64 indexes it does not serve (404).
          sudo dpkg --add-architecture arm64
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          else
            sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          fi
          codename="$(. /etc/os-release && echo "${VERSION_CODENAME}")"
          printf 'Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports\nSuites: %s %s-updates %s-backports %s-security\nComponents: main restricted universe multiverse\nArchitectures: arm64\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' \
            "$codename" "$codename" "$codename" "$codename" \
            | sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libasound2-dev:arm64

      - name: Install Linux deps (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev mold clang

      - name: Set x86_64-linux build env
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          {
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=clang"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-fuse-ld=mold -C relocation-model=dynamic-no-pic"
          } >> "$GITHUB_ENV"

      - name: Set cross-compile env (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            echo "PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu"
            echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig"
          } >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/vox dist/
          # Include all required shared libraries
          find target/${{ matrix.target }}/release -maxdepth 1 \( -name "*.dylib" -o -name "*.so" -o -name "*.so.*" \) | while IFS= read -r lib; do cp "$lib" dist/; done
          cd dist && tar czf "../${{ matrix.name }}.tar.gz" ./*

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ matrix.name }}.tar.gz

  npm-publish:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Update package version
        working-directory: npm
        run: npm version "${{ needs.release-please.outputs.tag_name }}" --no-git-tag-version --allow-same-version
      - name: Publish
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
